plugins {
    id 'com.android.application'
}

android {
    namespace 'com.variado.sportcal'
    compileSdk 36

    defaultConfig {
        applicationId 'com.variado.sportcal'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

